name: Build Qutex
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      # Ubuntu 24.04 permits this installed browser through its AppArmor profile.
      # Keep Chromium's sandbox enabled instead of weakening the runner policy.
      QUTEX_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          test -x "$QUTEX_CHROME_PATH"
          "$QUTEX_CHROME_PATH" --version
      - run: npx playwright-core install-deps chromium
      - run: npm run build
      # Each native suite launches an owned browser. Avoid competing browser
      # startups on a small runner; concurrency is still exercised within tests.
      - run: node --test --test-concurrency=1 test/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: qutex-cdn-${{ github.sha }}
          path: dist/
          retention-days: 14
