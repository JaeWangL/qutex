[package]
name = "qutex-font-outline"
version = "0.1.0"
edition = "2024"
description = "Persistent font-unit SVG outline and OpenType MATH extraction for Qutex"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout", "glyph-names"] }
